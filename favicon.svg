  <!-- rail tracks -->
  <line x1="4"  y1="26" x2="28" y2="26" stroke="#3a7d52" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="4"  y1="29" x2="28" y2="29" stroke="#3a7d52" stroke-width="1.4" stroke-linecap="round"/>
  <!-- sleepers -->
  <line x1="8"  y1="24.5" x2="8"  y2="30.5" stroke="#3a7d52" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="24.5" x2="14" y2="30.5" stroke="#3a7d52" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="24.5" x2="20" y2="30.5" stroke="#3a7d52" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26" y1="24.5" x2="26" y2="30.5" stroke="#3a7d52" stroke-width="1.2" stroke-linecap="round"/>
</svg>
