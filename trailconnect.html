<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrailbyRail</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Public+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--forest-dark:#0d2416;--forest-med:#1a4a2f;--moss:#3a7d52;--trail-tan:#e8a84a;--amber:#f0c060;--cloud:#f5f7f2;--sunrise:#e8622a;--cream:#fffdf7;--shadow:rgba(13,36,22,0.22)}
body{font-family:'Public Sans',sans-serif;background:var(--forest-dark);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 120% 60% at 50% 100%, #e8622a22 0%, transparent 60%),
  linear-gradient(170deg, #0d2416 0%, #122e1c 35%, #1a4a2f 65%, #0d2416 100%);
  pointer-events:none;z-index:0}
.container{max-width:1100px;margin:0 auto;padding:2rem;position:relative;z-index:1}

/* ── Hero header ── */
header{text-align:center;padding:3.5rem 1rem 2.5rem;animation:slideDown .9s cubic-bezier(.22,1,.36,1)}
@keyframes slideDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}
.logo-mark{display:inline-flex;align-items:center;justify-content:center;margin-bottom:1.5rem;filter:drop-shadow(0 4px 16px rgba(232,98,42,.35))}
.wordmark{font-family:'Righteous',cursive;font-size:clamp(2.8rem,9vw,5rem);color:#fff;letter-spacing:-.02em;line-height:1;margin-bottom:.6rem;text-shadow:0 2px 30px rgba(13,36,22,.5)}
.wordmark em{font-style:normal;color:var(--trail-tan)}
.hero-slogan{margin:0 auto 1rem;max-width:560px}
.slogan-main{display:block;font-size:clamp(1.1rem,3vw,1.55rem);font-weight:700;color:#fff;line-height:1.35;letter-spacing:-.01em}
.slogan-sub{display:inline-block;margin-top:.55rem;font-size:.95rem;color:rgba(255,255,255,.65);font-weight:300;letter-spacing:.04em}
.slogan-highlight{background:var(--trail-tan);color:var(--forest-dark);padding:.05em .35em;border-radius:5px;font-style:italic;font-weight:700}
.search-card{background:var(--cream);border-radius:24px;padding:2.5rem;box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12) inset;margin-bottom:2rem;animation:fadeIn .8s ease-out .2s both;border:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.search-form{display:grid;gap:1.5rem}
.input-group{display:flex;flex-direction:column;gap:.5rem}
label{font-weight:600;color:var(--forest-dark);font-size:.88rem;text-transform:uppercase;letter-spacing:.05em}
input[type=text],select{padding:1rem 1.25rem;border:2px solid var(--moss);border-radius:12px;font-size:1rem;font-family:'Public Sans',sans-serif;transition:all .3s ease;background:var(--cloud)}
input[type=text]:focus,select:focus{outline:none;border-color:var(--sunrise);background:white;box-shadow:0 4px 12px var(--shadow)}
.location-row{display:flex;gap:.75rem}
.location-row input{flex:1}
.loc-btn{padding:0 1.25rem;border:2px solid var(--moss);background:var(--cloud);border-radius:12px;cursor:pointer;font-size:1.2rem;transition:all .3s;flex-shrink:0}
.loc-btn:hover{background:var(--moss);border-color:var(--moss);color:white}
.ac-wrap{position:relative;flex:1}
.ac-wrap input{width:100%}
.ac-dropdown{position:absolute;top:calc(100% + 5px);left:0;right:0;background:white;border:2px solid var(--moss);border-radius:12px;box-shadow:0 8px 24px var(--shadow);z-index:200;max-height:280px;overflow-y:auto;display:none}
.ac-item{padding:.75rem 1.1rem;cursor:pointer;font-size:.9rem;color:var(--forest-dark);border-bottom:1px solid var(--cloud);line-height:1.3;transition:background .12s}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.ac-active{background:var(--cloud)}
.chip-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.1rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .9rem;border:2px solid var(--moss);border-radius:20px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--forest-dark);background:var(--cloud);transition:all .2s;user-select:none;white-space:nowrap}
.chip input[type=checkbox]{display:none}
.chip:has(input:checked){background:var(--moss);color:white;border-color:var(--moss)}
.chip:hover{border-color:var(--forest-dark);transform:translateY(-1px)}
.ac-item-main{font-weight:600}
.ac-item-sub{font-size:.78rem;color:var(--moss);margin-top:.1rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.slider-group{display:flex;flex-direction:column;gap:.65rem}
.slider-header{display:flex;justify-content:space-between;align-items:center}
.slider-val{font-size:1rem;font-weight:700;color:var(--sunrise);background:var(--cloud);padding:.3rem .75rem;border-radius:8px;border:2px solid var(--trail-tan);min-width:60px;text-align:center}
input[type=range]{width:100%;height:6px;border-radius:3px;outline:none;border:none;cursor:pointer;-webkit-appearance:none;padding:0;background:linear-gradient(to right,var(--moss) 0%,var(--moss) var(--fill,20%),#dde8e3 var(--fill,20%),#dde8e3 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--forest-dark);border:3px solid var(--trail-tan);cursor:pointer;box-shadow:0 2px 6px var(--shadow)}
.slider-ticks{display:flex;justify-content:space-between;font-size:.7rem;color:var(--moss);opacity:.8}
.btn-find{width:100%;padding:1.3rem;border:none;border-radius:12px;font-size:1.1rem;font-weight:600;font-family:'Righteous',cursive;cursor:pointer;background:linear-gradient(135deg,var(--moss),var(--forest-med));color:white;box-shadow:0 4px 15px rgba(74,124,89,.4);transition:all .3s;text-transform:uppercase;letter-spacing:.05em;position:relative;overflow:hidden}
.btn-find::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,.2);transform:translate(-50%,-50%);transition:width .6s,height .6s}
.btn-find:hover::before{width:600px;height:600px}
.btn-find:hover{transform:translateY(-3px);box-shadow:0 6px 25px rgba(74,124,89,.5)}
.btn-find:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.loading{text-align:center;padding:3rem 2rem;color:var(--forest-med)}
.loading-spinner{font-size:2.5rem;animation:spin 1.2s linear infinite;display:inline-block;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{font-size:1.1rem;color:var(--forest-dark)}
.loading-sub{font-size:.9rem;color:var(--moss);margin-top:.5rem}
.results-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding:.75rem 1rem;background:rgba(255,255,255,.12);border-radius:12px;border:1px solid rgba(255,255,255,.15)}
.results-count{font-family:'Righteous',cursive;font-size:1.2rem;color:#fff}
.results-hint{font-size:.82rem;color:rgba(255,255,255,.65)}
.results-grid{display:grid;gap:1.5rem}
.trail-card{background:var(--cream);border-radius:20px;padding:2rem;box-shadow:0 8px 30px rgba(0,0,0,.35);border-left:6px solid var(--moss);transition:all .3s ease;animation:slideUp .5s ease-out backwards}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.trail-card:hover{transform:translateX(6px);box-shadow:0 12px 40px var(--shadow);border-left-color:var(--sunrise)}
.trail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;gap:1rem}
.trail-name{font-family:'Righteous',cursive;font-size:1.35rem;color:var(--forest-dark);margin-bottom:.2rem}
.trail-sub{font-size:.83rem;color:var(--moss);font-weight:600}
.type-badge{display:inline-block;padding:.35rem .85rem;border-radius:8px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;margin-top:.2rem}
.badge-hiking{background:linear-gradient(135deg,var(--moss),var(--forest-med));color:white}
.badge-cycling{background:linear-gradient(135deg,#ff6b35,#f7931e);color:white}
.badge-nature{background:linear-gradient(135deg,var(--trail-tan),#c49060);color:var(--forest-dark)}
.badge-swimming{background:linear-gradient(135deg,#0077b6,#00b4d8);color:white}
.badge-skiing{background:linear-gradient(135deg,#5c8fc7,#a8d8ea);color:var(--forest-dark)}
/* Journey chain */
.journey-chain{display:flex;align-items:center;margin:1.25rem 0;padding:1.25rem 1rem;background:var(--cloud);border-radius:14px;overflow-x:auto;gap:0}
.jnode{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex-shrink:0;min-width:70px}
.jicon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.jicon-home{background:var(--forest-dark);color:white}
.jicon-stop{background:var(--moss);color:white}
.jicon-trail{background:var(--sunrise);color:white}
.jlabel{font-size:.72rem;font-weight:700;color:var(--forest-dark);text-align:center;max-width:80px;line-height:1.2}
.jsub{font-size:.68rem;color:var(--moss);text-align:center;max-width:80px;line-height:1.2}
.jleg{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:55px;padding:0 .25rem}
.jline{height:3px;width:100%;background:linear-gradient(to right,var(--moss),var(--forest-med));border-radius:2px;position:relative}
.jline::after{content:'▶';position:absolute;right:-5px;top:50%;transform:translateY(-50%);color:var(--forest-med);font-size:.65rem}
.jdist{font-size:.72rem;font-weight:700;color:var(--forest-med);white-space:nowrap}
/* Stops */
.stops-section{margin-top:1.25rem}
.stops-title{font-size:.78rem;font-weight:700;color:var(--moss);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.65rem}
.stop-list{display:flex;flex-direction:column;gap:.45rem}
.stop-item{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;background:var(--cloud);border:2px solid transparent;border-radius:10px;transition:all .2s;cursor:pointer;text-decoration:none;color:inherit}
.stop-item:hover{border-color:var(--moss);background:white;transform:translateX(4px)}
.stop-item.best{border-color:var(--trail-tan);background:white}
.stop-icon-sm{width:30px;height:30px;background:var(--moss);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.stop-name{font-weight:600;color:var(--forest-dark);font-size:.92rem}
.stop-meta{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.76rem;color:var(--moss);margin-top:.1rem}
.stop-lines{background:var(--forest-dark);color:white;padding:.1rem .4rem;border-radius:5px;font-weight:700;font-size:.7rem}
/* Actions */
.action-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.25rem;padding-top:1.25rem;border-top:2px dashed rgba(74,124,89,.2)}
.act-btn{padding:.55rem 1rem;border:2px solid var(--moss);background:transparent;color:var(--forest-dark);border-radius:9px;font-size:.85rem;font-weight:600;font-family:'Public Sans',sans-serif;cursor:pointer;transition:all .25s;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.act-btn:hover{background:var(--moss);color:white;border-color:var(--moss);transform:translateY(-2px)}
.act-btn.primary{background:var(--moss);color:white}
.act-btn.primary:hover{background:var(--forest-med);border-color:var(--forest-med)}
.no-results{text-align:center;padding:4rem 2rem;color:var(--forest-med);animation:fadeIn .5s ease-out}
.no-results-icon{font-size:4rem;margin-bottom:1rem;opacity:.5}
.no-results h3{font-family:'Righteous',cursive;font-size:1.8rem;color:var(--forest-dark);margin-bottom:.75rem}
.no-results p{max-width:420px;margin:0 auto;line-height:1.7;font-size:.95rem}
.error{background:#fee;border:2px solid #c33;color:#c33;padding:1.5rem;border-radius:12px}
.mode-toggle{display:flex;gap:.5rem}
.mode-btn{flex:1;padding:.65rem 1rem;border:2px solid var(--moss);border-radius:10px;background:transparent;color:var(--forest-med);font-weight:600;font-size:.9rem;cursor:pointer;transition:all .2s;font-family:'Public Sans',sans-serif}
.mode-btn.active{background:var(--moss);color:#fff;border-color:var(--moss)}
.dest-badge{display:inline-block;background:linear-gradient(135deg,#2196F3,#1565C0);color:#fff;font-size:.68rem;font-weight:700;padding:.15rem .5rem;border-radius:20px;letter-spacing:.04em;vertical-align:middle;margin-left:.4rem}
.source-pill{font-size:.68rem;padding:.18rem .55rem;border-radius:20px;font-weight:700;letter-spacing:.03em;vertical-align:middle;margin-left:.35rem}
.src-osm{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.src-oda{background:#fff3e0;color:#c84b00;border:1px solid #ffcc80}
.src-custom{background:#f3e5f5;color:#7b1fa2;border:1px solid #ce93d8}
.loop-panel{display:none;margin-top:1rem;padding:1.1rem;background:var(--cloud);border-radius:12px;border:2px solid var(--moss);animation:fadeIn .25s ease-out}
.loop-panel.open{display:block}
.upload-card{background:var(--cream);border-radius:24px;padding:2rem;box-shadow:0 24px 70px rgba(0,0,0,.45);margin-bottom:2rem;border:none}
.upload-card h2{font-family:'Righteous',cursive;color:var(--forest-dark);font-size:1.3rem;margin-bottom:1.25rem}
.upload-form{padding:1.1rem;background:var(--cloud);border-radius:12px;margin-bottom:1rem;display:none}
.route-list{display:flex;flex-direction:column;gap:.45rem;margin-top:.75rem}
.route-item{display:flex;align-items:center;gap:.75rem;padding:.65rem 1rem;background:var(--cloud);border-radius:10px}
.route-item-info{flex:1;min-width:0}
.route-item-name{font-weight:600;font-size:.92rem;color:var(--forest-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-item-meta{font-size:.76rem;color:var(--moss);margin-top:.1rem}
.btn-delete{background:transparent;border:none;color:#c33;cursor:pointer;font-size:1rem;padding:.2rem .4rem;border-radius:6px;transition:background .15s;flex-shrink:0}
.btn-delete:hover{background:#fee}
.diff-easy{color:#2e7d32;font-weight:700;font-size:.8rem}
.diff-moderate{color:#f57c00;font-weight:700;font-size:.8rem}
.diff-hard,.diff-difficult{color:#c62828;font-weight:700;font-size:.8rem}
details.api-settings{margin-top:1rem;border-top:2px dashed rgba(74,124,89,.2);padding-top:1rem}
details.api-settings summary{font-size:.85rem;font-weight:600;color:var(--moss);cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:.4rem}
details.api-settings summary::before{content:'⚙️'}
details.api-settings[open] summary{margin-bottom:.85rem}
.api-key-row{display:flex;flex-direction:column;gap:.4rem}
.api-key-row small{font-size:.78rem;color:var(--moss)}
.api-key-row a{color:var(--moss)}
/* ── Auth modal ── */
.auth-overlay{position:fixed;inset:0;background:rgba(20,40,20,.7);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s}
.auth-box{background:#fff;border-radius:20px;padding:2.5rem 2rem;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-box h2{font-family:'Righteous',cursive;font-size:1.6rem;color:var(--forest-dark);margin-bottom:.35rem}
.auth-box p{color:var(--forest-med);font-size:.9rem;margin-bottom:1.25rem}
.auth-field{width:100%;padding:.75rem 1rem;border:2px solid var(--moss);border-radius:10px;font-size:.95rem;font-family:'Public Sans',sans-serif;margin-bottom:.75rem;background:var(--cloud)}
.auth-field:focus{outline:none;border-color:var(--sunrise)}
.auth-submit{display:block;width:100%;background:linear-gradient(135deg,var(--moss),var(--forest-med));color:#fff;padding:.85rem 2rem;border-radius:50px;font-weight:600;font-size:1rem;border:none;cursor:pointer;margin-bottom:.75rem}
.auth-submit:hover{opacity:.9}
.auth-error{color:#c33;font-size:.85rem;margin-bottom:.5rem;min-height:1.2em}
.auth-toggle{font-size:.85rem;color:var(--moss);cursor:pointer;background:none;border:none;text-decoration:underline}
.auth-dismiss{font-size:.82rem;color:var(--moss);cursor:pointer;background:none;border:none;text-decoration:underline;margin-top:.35rem;display:block}
/* ── Auth bar ── */
.auth-bar{display:flex;justify-content:center;align-items:center;gap:.6rem;margin-top:.75rem;font-size:.83rem}
.auth-bar-btn{padding:.3rem .85rem;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);color:#fff;border-radius:20px;font-size:.8rem;font-weight:600;font-family:'Public Sans',sans-serif;cursor:pointer;transition:all .2s}
.auth-bar-btn:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.7)}
.auth-bar-user{color:rgba(255,255,255,.85);font-size:.82rem}
/* ── Sync hint banner ── */
.sync-hint{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;background:rgba(58,125,82,.18);border:1px solid rgba(58,125,82,.35);border-radius:10px;font-size:.82rem;color:var(--forest-dark);margin-top:.5rem;animation:fadeIn .3s}
.sync-hint button{background:none;border:none;cursor:pointer;font-size:.9rem;opacity:.5;margin-left:auto;flex-shrink:0}
.sync-hint button:hover{opacity:1}
.deco{position:fixed;pointer-events:none;z-index:0}
.deco-1{top:12%;left:2%;font-size:9rem;opacity:.06;animation:sway 6s ease-in-out infinite}
.deco-2{bottom:18%;right:3%;font-size:12rem;opacity:.05;animation:sway 7s ease-in-out infinite 1s}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media(max-width:700px){.form-row{grid-template-columns:1fr}.journey-chain{padding:.9rem .5rem}}
/* ── Weather ── */
.weather-row{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap}
.weather-day{flex:1;min-width:70px;background:var(--cloud);border-radius:10px;padding:.5rem .6rem;text-align:center;font-size:.78rem;color:var(--forest-dark)}
.weather-emoji{font-size:1.4rem;display:block;margin-bottom:.2rem}
.weather-temp{font-weight:700;font-size:.85rem}
.weather-precip{font-size:.72rem;color:var(--moss)}
/* ── Filter bar ── */
.filter-bar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.75rem 1rem;background:rgba(255,255,255,.1);border-radius:12px;border:1px solid rgba(255,255,255,.15);margin-bottom:1rem}
.filter-bar label{color:#fff;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.filter-bar input[type=number]{width:70px;padding:.3rem .5rem;border-radius:8px;border:1.5px solid var(--moss);font-size:.85rem;background:var(--cloud)}
.filter-bar input[type=checkbox]{width:16px;height:16px;cursor:pointer}
/* ── Done badge ── */
.trail-card.done-trail{opacity:.8;border-left-color:var(--moss)!important}
.act-btn.done-active{background:var(--moss);color:white;border-color:var(--moss)}
/* ── Reviews ── */
.review-panel{display:none;margin-top:1rem;padding:1.1rem;background:var(--cloud);border-radius:12px;border:2px solid var(--moss);animation:fadeIn .25s ease-out}
.review-panel.open{display:block}
.review-item{padding:.6rem 0;border-bottom:1px solid rgba(58,125,82,.15);font-size:.88rem;color:var(--forest-dark)}
.review-item:last-child{border-bottom:none}
.review-stars{color:#f0c060;font-size:1rem;margin-bottom:.15rem}
.review-comment{color:var(--forest-dark);line-height:1.5}
.review-date{font-size:.72rem;color:var(--moss);margin-top:.15rem}
.review-form{margin-top:.75rem;padding-top:.75rem;border-top:1.5px dashed rgba(58,125,82,.3)}
.star-input{display:flex;gap:.25rem;margin:.35rem 0}
.star-input span{font-size:1.5rem;cursor:pointer;color:#ddd;transition:color .15s}
.star-input span.active{color:#f0c060}
.review-textarea{width:100%;border:1.5px solid var(--moss);border-radius:8px;padding:.5rem .75rem;font-family:'Public Sans',sans-serif;font-size:.88rem;resize:vertical;min-height:60px;margin-top:.35rem}
.avg-rating{font-size:.78rem;font-weight:700;color:var(--trail-tan);background:rgba(240,192,96,.18);padding:.15rem .5rem;border-radius:6px;margin-left:.4rem}
/* ── Saved searches ── */
.saved-searches{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.75rem}
.saved-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .85rem;border:2px solid var(--moss);border-radius:20px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--forest-dark);background:white;transition:all .2s;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.saved-chip:hover{background:var(--moss);color:white}
.saved-chip .del-saved{margin-left:.2rem;opacity:.5;flex-shrink:0}
.saved-chip .del-saved:hover{opacity:1}
/* ── Seasonal chip ── */
.season-chip{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .55rem;border-radius:12px;font-size:.72rem;font-weight:600;background:rgba(58,125,82,.12);border:1px solid rgba(58,125,82,.25);color:var(--forest-dark);margin-left:.35rem;vertical-align:middle}
/* ── Share list / GPX pack ── */
.meta-btn{padding:.45rem .85rem;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:9px;font-size:.82rem;font-weight:600;font-family:'Public Sans',sans-serif;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.3rem}
.meta-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<div class="deco deco-1">🌲</div>
<div class="deco deco-2">🏔️</div>
<div class="container">
  <header>
    <div class="logo-mark">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- mountain -->
        <path d="M36 10 L58 52 H14 Z" fill="none" stroke="#e8a84a" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M20 52 L36 24 L44 38" fill="none" stroke="rgba(232,168,74,.45)" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- snow cap -->
        <path d="M36 10 L42 24 L36 20 L30 24 Z" fill="#e8a84a" opacity=".9"/>
        <!-- rail track (two lines + sleepers) -->
        <line x1="14" y1="60" x2="58" y2="60" stroke="#3a7d52" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="14" y1="66" x2="58" y2="66" stroke="#3a7d52" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="22" y1="57" x2="22" y2="69" stroke="#3a7d52" stroke-width="2" stroke-linecap="round"/>
        <line x1="32" y1="57" x2="32" y2="69" stroke="#3a7d52" stroke-width="2" stroke-linecap="round"/>
        <line x1="42" y1="57" x2="42" y2="69" stroke="#3a7d52" stroke-width="2" stroke-linecap="round"/>
        <line x1="52" y1="57" x2="52" y2="69" stroke="#3a7d52" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="wordmark">Trail<em>by</em>Rail</h1>
    <div class="hero-slogan">
      <span class="slogan-main">Discover trails — <span class="slogan-highlight">no car needed</span></span>
      <span class="slogan-sub">Find hiking, cycling &amp; outdoor spots reachable by public transport</span>
    </div>
    <div class="auth-bar" id="authBar">
      <button class="auth-bar-btn" onclick="showAuthModal('login')">Login</button>
      <button class="auth-bar-btn" onclick="showAuthModal('register')">Register</button>
    </div>
  </header>

  <!-- Auth modal -->
  <div id="authModal" style="display:none" class="auth-overlay" onclick="if(event.target===this)closeAuthModal()">
    <div class="auth-box">
      <div style="font-size:2rem;margin-bottom:.5rem" id="authModalIcon">👤</div>
      <h2 id="authModalTitle">Log in</h2>
      <p id="authModalSub">Sync done trails &amp; saved searches across devices</p>
      <div class="auth-error" id="authError"></div>
      <input class="auth-field" type="email" id="authEmail" placeholder="Email address" autocomplete="email">
      <input class="auth-field" type="password" id="authPassword" placeholder="Password (min 8 chars)" autocomplete="current-password">
      <button class="auth-submit" id="authSubmitBtn" onclick="submitAuth()">Log in</button>
      <button class="auth-toggle" id="authToggleBtn" onclick="toggleAuthView()">No account yet? Register</button>
      <button class="auth-dismiss" onclick="closeAuthModal()">Cancel</button>
    </div>
  </div>

  <div class="search-card">
    <form class="search-form" id="searchForm">
      <div class="input-group">
        <label for="location">📍 Your address or area</label>
        <div class="location-row">
          <div class="ac-wrap">
            <input type="text" id="location" placeholder="e.g. Amsterdam Centraal, Breda, Utrecht…" required autocomplete="off">
            <div class="ac-dropdown" id="acDropdown"></div>
          </div>
          <button type="button" class="loc-btn" id="locationBtn" title="Detect my location">📡</button>
        </div>
      </div>

      <div class="form-row">
        <div class="input-group">
          <label for="activity">Activity</label>
          <select id="activity">
            <option value="hiking">🥾 Hiking / Running</option>
            <option value="cycling">🚴 Cycling</option>
            <option value="swimming">🏊 Swimming</option>
            <option value="skiing">⛷️ Skiing</option>
          </select>
        </div>
      </div>

      <div class="input-group" id="trailTypeGroup">
        <label>Trail types</label>
        <div class="chip-row" id="trailTypeChips"></div>
      </div>

      <div class="mode-toggle">
        <button type="button" class="mode-btn active" id="modeNearHome" onclick="setSearchMode('home')">🏠 Near home</button>
        <button type="button" class="mode-btn" id="modeDestination" onclick="setSearchMode('destination')">🗺️ By destination</button>
      </div>

      <div class="input-group" id="destinationGroup" style="display:none">
        <label for="destination">🗺️ Destination area</label>
        <div class="ac-wrap">
          <input type="text" id="destination" placeholder="e.g. Black Forest, Snowdonia, Dolomites, Alps…" autocomplete="off">
          <div class="ac-dropdown" id="acDropdownDest"></div>
        </div>
      </div>

      <div class="input-group">
        <label>Transport modes</label>
        <div class="chip-row">
          <label class="chip"><input type="checkbox" name="ptMode" value="bus" checked>🚌 Bus</label>
          <label class="chip"><input type="checkbox" name="ptMode" value="tram" checked>🚊 Tram</label>
          <label class="chip"><input type="checkbox" name="ptMode" value="train" checked>🚂 Train</label>
          <label class="chip"><input type="checkbox" name="ptMode" value="metro" checked>🚇 Metro</label>
        </div>
      </div>

      <div class="slider-group" id="walkToStopGroup">
        <div class="slider-header">
          <label id="walkToStopLabel">🚶 Walk from home to stop</label>
          <span class="slider-val" id="walkToStopVal">5km</span>
        </div>
        <input type="range" id="walkToStop" min="500" max="10000" step="500" value="5000">
        <div class="slider-ticks" id="walkToStopTicks"><span>500m</span><span>2.5km</span><span>5km</span><span>7.5km</span><span>10km</span></div>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <label id="walkFromStopLabel">🏔️ Walk from stop to trailhead</label>
          <span class="slider-val" id="walkFromStopVal">5km</span>
        </div>
        <input type="range" id="walkFromStop" min="500" max="15000" step="500" value="5000">
        <div class="slider-ticks" id="walkFromStopTicks"><span>500m</span><span>4km</span><span>7.5km</span><span>11km</span><span>15km</span></div>
      </div>

      <div style="display:flex;gap:.75rem;align-items:stretch">
        <button type="submit" class="btn-find" id="findBtn" style="flex:1">
          <span style="position:relative;z-index:1">🔍 Find Trails</span>
        </button>
        <button type="button" class="act-btn" id="saveSearchBtn" onclick="saveCurrentSearch()" title="Save this search" style="padding:.9rem 1rem;font-size:1rem;border-radius:12px;border:2px solid var(--moss);flex-shrink:0">💾 Save</button>
      </div>
<div id="savedSearchesRow" class="saved-searches"></div>

    </form>
  </div>

  <div class="upload-card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>📁 My Routes</h2>
      <button class="act-btn" onclick="toggleUploadForm()">+ Upload GPX</button>
    </div>
    <div class="upload-form" id="uploadForm">
      <div class="input-group" style="margin-bottom:.75rem">
        <label for="uploadName">Route name <span style="font-weight:400;color:var(--moss)">(optional)</span></label>
        <input type="text" id="uploadName" placeholder="e.g. Mastbos loop">
      </div>
      <div class="input-group" style="margin-bottom:.75rem">
        <label for="uploadType">Activity</label>
        <select id="uploadType">
          <option value="hiking">🥾 Hiking / Running</option>
          <option value="cycling">🚴 Cycling</option>
          <option value="swimming">🏊 Swimming</option>
          <option value="skiing">⛷️ Skiing</option>
        </select>
      </div>
      <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
        <input type="file" id="gpxFile" accept=".gpx" style="flex:1;min-width:0">
        <button class="act-btn primary" onclick="doUploadGPX()">Upload</button>
      </div>
      <div id="uploadStatus" style="margin-top:.5rem;font-size:.85rem"></div>
    </div>
    <div class="route-list" id="myRoutesList"><p style="color:var(--moss);font-size:.9rem">Loading…</p></div>
  </div>

  <div id="results"></div>
</div>

<script>
let homeLat, homeLon, currentTrails = [], selectedCoords = null;
let searchMode = 'home'; // 'home' | 'destination'
let destLat, destLon, selectedDestCoords = null;
let doneTrails = new Set(JSON.parse(localStorage.getItem('doneTrails') || '[]'));
let reviewsLoaded = {};
let reviewRatings = {};
let lastSearchParams = null;
let currentUser = null; // {id, email, is_pro}

// Autocomplete
const locInput = document.getElementById('location');
const acDropdown = document.getElementById('acDropdown');
let acTimer;

locInput.addEventListener('input', function() {
  selectedCoords = null;
  clearTimeout(acTimer);
  const q = this.value.trim();
  if (q.length < 3) { hideAC(); return; }
  acTimer = setTimeout(() => fetchAC(q), 300);
});

locInput.addEventListener('keydown', function(e) {
  const items = acDropdown.querySelectorAll('.ac-item');
  const active = acDropdown.querySelector('.ac-item.ac-active');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = active ? active.nextElementSibling : items[0];
    if (next) { active?.classList.remove('ac-active'); next.classList.add('ac-active'); next.scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = active?.previousElementSibling;
    if (prev) { active.classList.remove('ac-active'); prev.classList.add('ac-active'); prev.scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'Enter' && active) {
    e.preventDefault();
    pickItem(active);
  } else if (e.key === 'Escape') {
    hideAC();
  }
});

locInput.addEventListener('blur', () => setTimeout(hideAC, 150));

async function fetchAC(q) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&addressdetails=1`, {headers:{'Accept-Language':'nl,en'}});
    const data = await r.json();
    renderAC(data);
  } catch { hideAC(); }
}

function renderAC(items) {
  if (!items.length) { hideAC(); return; }
  acDropdown.innerHTML = items.map(item => {
    const {main, sub} = fmtSuggestion(item);
    return `<div class="ac-item" data-lat="${item.lat}" data-lon="${item.lon}" data-name="${esc(main + (sub ? ', ' + sub.split(',')[0] : ''))}">
      <div class="ac-item-main">${main}</div>
      ${sub ? `<div class="ac-item-sub">${sub}</div>` : ''}
    </div>`;
  }).join('');
  acDropdown.querySelectorAll('.ac-item').forEach(el => el.addEventListener('mousedown', e => { e.preventDefault(); pickItem(el); }));
  acDropdown.style.display = 'block';
}

function pickItem(el) {
  locInput.value = el.dataset.name;
  selectedCoords = {lat: parseFloat(el.dataset.lat), lon: parseFloat(el.dataset.lon)};
  hideAC();
}

function hideAC() { acDropdown.style.display = 'none'; acDropdown.innerHTML = ''; }

// ── Destination autocomplete ──────────────────────────────────────────────────

const destInput = document.getElementById('destination');
const acDropdownDest = document.getElementById('acDropdownDest');
let acTimerDest;

destInput.addEventListener('input', function() {
  selectedDestCoords = null;
  clearTimeout(acTimerDest);
  const q = this.value.trim();
  if (q.length < 3) { hideACDest(); return; }
  acTimerDest = setTimeout(() => fetchACDest(q), 300);
});

destInput.addEventListener('keydown', function(e) {
  const items = acDropdownDest.querySelectorAll('.ac-item');
  const active = acDropdownDest.querySelector('.ac-item.ac-active');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = active ? active.nextElementSibling : items[0];
    if (next) { active?.classList.remove('ac-active'); next.classList.add('ac-active'); next.scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = active?.previousElementSibling;
    if (prev) { active.classList.remove('ac-active'); prev.classList.add('ac-active'); prev.scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'Enter' && active) {
    e.preventDefault();
    pickDestItem(active);
  } else if (e.key === 'Escape') {
    hideACDest();
  }
});

destInput.addEventListener('blur', () => setTimeout(hideACDest, 150));

// Classify OSM class/type combos as outdoor areas and return a human label
const OUTDOOR_LABELS = {
  natural: {
    peak: '⛰️ Mountain Peak', mountain_range: '🏔️ Mountain Range', fell: '🏔️ Fell',
    hill: '⛰️ Hill', volcano: '🌋 Volcano', cliff: '🪨 Cliff',
    forest: '🌲 Forest', wood: '🌲 Wood', scrub: '🌿 Scrubland',
    heath: '🌿 Heath', moor: '🌿 Moorland', grassland: '🌿 Grassland',
    wetland: '🌿 Wetland', beach: '🏖️ Beach', coastline: '🏖️ Coastline',
    water: '💧 Lake / Water', bay: '🌊 Bay', cape: '🌊 Cape',
    cave_entrance: '🕳️ Cave', glacier: '🧊 Glacier', valley: '🏞️ Valley',
    gorge: '🏞️ Gorge', peninsula: '🗺️ Peninsula', island: '🏝️ Island',
    islet: '🏝️ Islet', dune: '🏜️ Dune', desert: '🏜️ Desert',
    spring: '💧 Spring', hot_spring: '♨️ Hot Spring',
    tree_row: '🌳 Tree Row', tree: '🌳 Tree',
  },
  leisure: {
    nature_reserve: '🌿 Nature Reserve', park: '🌳 Park',
    garden: '🌸 Garden', national_park: '🏞️ National Park',
    horse_riding: '🐴 Riding Area', swimming_area: '🏊 Swimming Area',
    marina: '⛵ Marina',
  },
  landuse: {
    forest: '🌲 Forest', farmland: '🌾 Farmland', meadow: '🌾 Meadow',
    grass: '🌿 Grassland', village_green: '🌿 Village Green',
    recreation_ground: '🏃 Recreation Ground', allotments: '🌱 Allotments',
    orchard: '🍎 Orchard', vineyard: '🍇 Vineyard', plant_nursery: '🌱 Nursery',
  },
  boundary: {
    national_park: '🏞️ National Park', protected_area: '🛡️ Protected Area',
    forest: '🌲 Forest Area', nature_reserve: '🌿 Nature Reserve',
    regional_park: '🌳 Regional Park', administrative: null, // skip
  },
  place: {
    island: '🏝️ Island', archipelago: '🏝️ Archipelago',
    sea: '🌊 Sea', ocean: '🌊 Ocean',
    region: '🗺️ Region', municipality: null, // skip
  },
  waterway: {
    river: '🏞️ River', stream: '💧 Stream', canal: '⛵ Canal',
    lake: '💧 Lake',
  },
  tourism: {
    camp_site: '⛺ Campsite', picnic_site: '🧺 Picnic Area',
    viewpoint: '👁️ Viewpoint', wilderness_hut: '🛖 Wilderness Hut',
  },
};

function outdoorLabel(cls, type) {
  return OUTDOOR_LABELS[cls]?.[type] ?? null;
}

async function fetchACDest(q) {
  try {
    // Fetch a generous set and then filter/rank outdoor-first
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=15&addressdetails=1`,
      {headers: {'Accept-Language': 'en'}}
    );
    const data = await r.json();
    // Separate outdoor-tagged from rest
    const outdoor = data.filter(i => outdoorLabel(i.class, i.type) !== null &&
                                     outdoorLabel(i.class, i.type) !== undefined);
    // Fallback: if we got outdoor hits, show only those; otherwise show all non-street results
    const fallback = data.filter(i => !['highway', 'amenity', 'shop', 'office', 'building'].includes(i.class));
    renderACDest(outdoor.length ? outdoor.slice(0, 6) : fallback.slice(0, 6));
  } catch { hideACDest(); }
}

function renderACDest(items) {
  if (!items.length) { hideACDest(); return; }
  acDropdownDest.innerHTML = items.map(item => {
    const label = outdoorLabel(item.class, item.type);
    const parts = item.display_name.split(',').map(s => s.trim());
    const name  = parts[0];
    // Build a short location string: skip duplicates of the name, take up to 2 parts
    const loc   = parts.slice(1).filter(p => p !== name).slice(0, 2).join(', ');
    const safeLabel = label ? `<span style="font-size:.72rem;background:#e8f5e9;color:#2e7d32;border-radius:20px;padding:.1rem .45rem;margin-right:.35rem;font-weight:700">${label}</span>` : '';
    return `<div class="ac-item" data-lat="${item.lat}" data-lon="${item.lon}" data-name="${esc(name + (loc ? ', ' + loc.split(',')[0] : ''))}">
      <div class="ac-item-main">${name}</div>
      <div class="ac-item-sub">${safeLabel}${loc}</div>
    </div>`;
  }).join('');
  acDropdownDest.querySelectorAll('.ac-item').forEach(el => el.addEventListener('mousedown', e => { e.preventDefault(); pickDestItem(el); }));
  acDropdownDest.style.display = 'block';
}

function pickDestItem(el) {
  destInput.value = el.dataset.name;
  selectedDestCoords = {lat: parseFloat(el.dataset.lat), lon: parseFloat(el.dataset.lon)};
  hideACDest();
}

function hideACDest() { acDropdownDest.style.display = 'none'; acDropdownDest.innerHTML = ''; }

// ── Search mode toggle ────────────────────────────────────────────────────────

function setSearchMode(mode) {
  searchMode = mode;
  document.getElementById('modeNearHome').classList.toggle('active', mode === 'home');
  document.getElementById('modeDestination').classList.toggle('active', mode === 'destination');
  const destGroup = document.getElementById('destinationGroup');
  const walkToStopGroup = document.getElementById('walkToStopGroup');
  destGroup.style.display = mode === 'destination' ? '' : 'none';
  walkToStopGroup.style.display = mode === 'destination' ? 'none' : '';
  // Update "from stop" label
  const act = document.getElementById('activity').value;
  const cfg = ACTIVITY_CONFIG[act] || ACTIVITY_CONFIG.hiking;
  document.getElementById('walkFromStopLabel').textContent =
    mode === 'destination' ? '🏔️ Radius around destination' : cfg.fromStopLabel;
}

function fmtSuggestion(item) {
  const a = item.address || {};
  const road = a.road ? a.road + (a.house_number ? ' ' + a.house_number : '') : null;
  const city = a.city || a.town || a.village || a.municipality || a.county || '';
  const country = a.country || '';
  const main = road || a.suburb || a.neighbourhood || city || item.display_name.split(',')[0];
  const subParts = [road ? city : '', country].filter(Boolean);
  return {main, sub: subParts.join(', ')};
}

function esc(s) { return s.replace(/"/g, '&quot;'); }

function fmt(m) {
  m = Math.round(m);
  return m < 1000 ? m + 'm' : (m / 1000).toFixed(m < 5000 ? 1 : 0) + 'km';
}

function updateSlider(id, valId) {
  const el = document.getElementById(id);
  const val = parseInt(el.value);
  document.getElementById(valId).textContent = fmt(val);
  const pct = ((val - el.min) / (el.max - el.min)) * 100;
  el.style.setProperty('--fill', pct + '%');
}

const ACTIVITY_CONFIG = {
  hiking:   {
    toStopLabel:   '🚶 Walk from home to stop',
    fromStopLabel: '🥾 Walk from stop to trailhead',
    toStop:   {min:500,  max:10000, step:500,  value:5000,  ticks:['500m','2.5km','5km','7.5km','10km']},
    fromStop: {min:500,  max:15000, step:500,  value:5000,  ticks:['500m','4km','7.5km','11km','15km']},
  },
  cycling:  {
    toStopLabel:   '🚴 Cycle from home to stop',
    fromStopLabel: '🚴 Cycle from stop to trailhead',
    toStop:   {min:1000, max:50000, step:1000, value:30000, ticks:['1km','12km','25km','37km','50km']},
    fromStop: {min:1000, max:50000, step:1000, value:30000, ticks:['1km','12km','25km','37km','50km']},
  },
  swimming: {
    toStopLabel:   '🚶 Walk from home to stop',
    fromStopLabel: '🏊 Walk from stop to swimming spot',
    toStop:   {min:500,  max:10000, step:500,  value:5000,  ticks:['500m','2.5km','5km','7.5km','10km']},
    fromStop: {min:500,  max:10000, step:500,  value:5000,  ticks:['500m','2.5km','5km','7.5km','10km']},
  },
  skiing:   {
    toStopLabel:   '🚶 Walk from home to stop',
    fromStopLabel: '⛷️ Walk from stop to ski area',
    toStop:   {min:500,  max:10000, step:500,  value:5000,  ticks:['500m','2.5km','5km','7.5km','10km']},
    fromStop: {min:500,  max:10000, step:500,  value:5000,  ticks:['500m','2.5km','5km','7.5km','10km']},
  },
};

const TRAIL_TYPE_DEFS = {
  hiking:   [{id:'hiking',   label:'🥾 Hiking trails'}, {id:'running', label:'🏃 Running routes'},
             {id:'nature',   label:'🌿 Nature reserves'}, {id:'park',  label:'🌲 National parks'}],
  cycling:  [{id:'cycling',  label:'🚴 Cycling routes'}, {id:'mtb',   label:'🚵 MTB'}],
  swimming: [{id:'swimming', label:'🏊 Swimming spots'}, {id:'lido',  label:'🌊 Open water / lido'}],
  skiing:   [{id:'downhill', label:'⛷️ Downhill'},       {id:'nordic', label:'🎿 Nordic / XC'}],
};

function setSliders(activity) {
  const cfg = ACTIVITY_CONFIG[activity] || ACTIVITY_CONFIG.hiking;
  const to = document.getElementById('walkToStop');
  to.min = cfg.toStop.min; to.max = cfg.toStop.max; to.step = cfg.toStop.step; to.value = cfg.toStop.value;
  document.getElementById('walkToStopTicks').innerHTML  = cfg.toStop.ticks.map(t => `<span>${t}</span>`).join('');
  document.getElementById('walkToStopLabel').textContent = cfg.toStopLabel;
  const from = document.getElementById('walkFromStop');
  from.min = cfg.fromStop.min; from.max = cfg.fromStop.max; from.step = cfg.fromStop.step; from.value = cfg.fromStop.value;
  document.getElementById('walkFromStopTicks').innerHTML  = cfg.fromStop.ticks.map(t => `<span>${t}</span>`).join('');
  document.getElementById('walkFromStopLabel').textContent = cfg.fromStopLabel;
  updateSlider('walkToStop',   'walkToStopVal');
  updateSlider('walkFromStop', 'walkFromStopVal');
}

function updateTrailTypeChips(activity) {
  const defs = TRAIL_TYPE_DEFS[activity] || TRAIL_TYPE_DEFS.hiking;
  document.getElementById('trailTypeChips').innerHTML = defs.map(d =>
    `<label class="chip"><input type="checkbox" name="trailType" value="${d.id}" checked>${d.label}</label>`
  ).join('');
}

function getChecked(name) {

function dist(lat1, lon1, lat2, lon2) {
  const R = 6371000, dl = (lat2-lat1)*Math.PI/180, do_ = (lon2-lon1)*Math.PI/180;
  return R * 2 * Math.atan2(
    Math.sqrt(Math.sin(dl/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(do_/2)**2),
    Math.sqrt(1 - Math.sin(dl/2)**2 - Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(do_/2)**2)
  );
}

async function overpass(query) {
  const r = await fetch('/api/overpass', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({query})
  });
  if (!r.ok) {
    let msg = 'Overpass error';
    try { const e = await r.json(); msg = e.error || msg; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

async function geocode(loc) {
  if (selectedCoords) { const c = selectedCoords; selectedCoords = null; return c; }
  const r = await fetch('/api/geocode', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({location: loc})
  });
  const d = await r.json();
  if (!d.length) throw new Error(`Location not found: "${loc}"`);
  return {lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon)};
}

async function reverseGeocode(lat, lon) {
  try {
    const d = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)).json();
    const a = d.address || {};
    const street = a.road ? a.road + (a.house_number ? ' ' + a.house_number : '') : null;
    const city = a.city || a.town || a.village || '';
    return street ? `${street}, ${city}` : city || `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
  } catch { return `${lat.toFixed(3)}, ${lon.toFixed(3)}`; }
}

function stopType(tags) {
  if (tags.railway === 'station') return 'Train station';
  if (tags.railway === 'halt') return 'Train halt';
  if (tags.railway === 'tram_stop') return 'Tram stop';
  if (tags.railway === 'subway_entrance') return 'Metro';
  if (tags.amenity === 'bus_station') return 'Bus station';
  return 'Bus stop';
}
function stopIcon(tags) {
  if (tags.railway === 'station' || tags.railway === 'halt') return '🚂';
  if (tags.railway === 'tram_stop') return '🚊';
  if (tags.railway === 'subway_entrance') return '🚇';
  return '🚌';
}

async function fetchStops(lat, lon, radiusM, modes) {
  const r = Math.round(radiusM);
  const a = `around:${r},${lat},${lon}`;
  const lines = [
    modes.includes('bus')   && `node["highway"="bus_stop"](${a});\n    node["amenity"="bus_station"](${a});`,
    modes.includes('tram')  && `node["railway"="tram_stop"](${a});`,
    modes.includes('train') && `node["railway"="station"](${a});\n    node["railway"="halt"](${a});`,
    modes.includes('metro') && `node["railway"="subway_entrance"](${a});`,
  ].filter(Boolean).join('\n    ');
  if (!lines) return [];
  const q = `[out:json][timeout:25];(\n    ${lines}\n  );out body;`;
  const data = await overpass(q);
  return data.elements.filter(e => e.lat && e.lon).map(e => ({
    id: e.id, lat: e.lat, lon: e.lon,
    name: e.tags?.name || e.tags?.ref || 'Unnamed stop',
    type: stopType(e.tags || {}),
    icon: stopIcon(e.tags || {}),
    lines: e.tags?.route_ref || e.tags?.ref || '',
    distFromHome: dist(lat, lon, e.lat, e.lon)
  }));
}

// ── Outdooractive ─────────────────────────────────────────────────────────────

const ODA_CATS = {hiking:'tour/hiking', cycling:'tour/cycling', mtb:'tour/mountainbiking'};

async function fetchOutdooractive(lat, lon, radiusM, subtypes) {
  const radiusKm = Math.max(1, Math.ceil(radiusM / 1000));
  const cats = [...new Set(subtypes.filter(s => ODA_CATS[s]).map(s => ODA_CATS[s]))];
  if (!cats.length) return [];

  const results = await Promise.all(cats.map(cat =>
    fetch('/api/outdooractive', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({lat, lon, cat, radius: radiusKm, limit: 20})
    }).then(r => r.json())
      .then(d => {
        const arr = d.tours || d.results || (Array.isArray(d) ? d : []);
        const subtype = Object.keys(ODA_CATS).find(k => ODA_CATS[k] === cat) || 'hiking';
        return arr.map(t => parseODA(t, subtype)).filter(Boolean);
      })
      .catch(() => [])
  ));

  const seen = new Set();
  return results.flat().filter(t => !seen.has(t.id) && seen.add(t.id));
}

function parseODA(t, subtype) {
  const lat = parseFloat(t.geometry?.start?.lat ?? t.startPoint?.lat ?? t.lat);
  const lon = parseFloat(t.geometry?.start?.lng ?? t.geometry?.start?.lon
              ?? t.startPoint?.lng ?? t.lng ?? t.lon);
  if (!lat || !lon || !t.title) return null;
  let type = 'hiking', label = 'Hiking Trail', icon = '🥾';
  if (subtype === 'cycling') { type = 'cycling'; label = 'Cycling Route'; icon = '🚴'; }
  if (subtype === 'mtb')     { type = 'cycling'; label = 'MTB Route';      icon = '🚵'; }
  const distM   = t.stats?.length ?? t.length ?? t.distance;
  const ascent  = t.stats?.ascent ?? t.ascent ?? null;
  const diff    = t.ratings?.difficulty ?? t.difficulty ?? null;
  const diffMap = {1:'easy', 2:'moderate', 3:'hard', 4:'hard', easy:'easy', moderate:'moderate', hard:'hard'};
  return {
    id: `oda_${t.id}`, name: t.title,
    sub: t.primaryCategory?.name ?? null,
    trailDist: distM ? (distM / 1000).toFixed(1) : null,
    difficulty: diff != null ? (diffMap[diff] ?? String(diff).toLowerCase()) : null,
    isLoop: !!(t.roundtrip ?? t.isRoundtrip),
    type, label, icon, lat, lon,
    source: 'oda', wtType: null,
    oda_url: t.url ?? null,
    elevGain: ascent,
  };
}


// ── Waymarked Trails ─────────────────────────────────────────────────────────

function toBbox(lat, lon, radiusM) {
  const dlat = radiusM / 111320;
  const dlon = radiusM / (111320 * Math.cos(lat * Math.PI / 180));
  return `${(lon-dlon).toFixed(5)},${(lat-dlat).toFixed(5)},${(lon+dlon).toFixed(5)},${(lat+dlat).toFixed(5)}`;
}

async function wtCall(type, routeType, params) {
  const r = await fetch('/api/waymarked-trails', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({type, route_type: routeType, ...params})
  });
  if (!r.ok) throw new Error(`WT API error ${r.status}`);
  return type === 'gpx' ? r.blob() : r.json();
}

// ── Overpass trail + area search ─────────────────────────────────────────────

// Build a bounding box string for Overpass from a centre + radius in metres.
// bbox queries use spatial indexes and are ~5–10× faster than `around` for relations.
function toBbox(lat, lon, radiusM) {
  const r = Math.min(radiusM, 25000);
  const dLat = r / 111320;
  const dLon = r / (111320 * Math.cos(lat * Math.PI / 180));
  return `${(lat - dLat).toFixed(5)},${(lon - dLon).toFixed(5)},${(lat + dLat).toFixed(5)},${(lon + dLon).toFixed(5)}`;
}

async function fetchTrails(lat, lon, radiusM, subtypes) {
  const bb = toBbox(lat, lon, radiusM);
  const lines = [
    subtypes.includes('hiking')   && `relation["route"="hiking"]["name"](${bb});`,
    subtypes.includes('running')  && `relation["route"="running"]["name"](${bb});`,
    subtypes.includes('nature')   && `way["leisure"="nature_reserve"]["name"](${bb});\n    relation["leisure"="nature_reserve"]["name"](${bb});`,
    subtypes.includes('park')     && `way["boundary"="national_park"]["name"](${bb});\n    relation["boundary"="national_park"]["name"](${bb});`,
    subtypes.includes('cycling')  && `relation["route"="bicycle"]["name"](${bb});`,
    subtypes.includes('mtb')      && `relation["route"="mtb"]["name"](${bb});`,
    subtypes.includes('swimming') && `node["leisure"="swimming_area"](${bb});\n    node["sport"="swimming"]["leisure"](${bb});\n    way["leisure"="swimming_area"](${bb});`,
    subtypes.includes('lido')     && `node["leisure"="swimming_pool"]["access"!="private"](${bb});\n    node["natural"="water"]["sport"="swimming"](${bb});\n    way["natural"="water"]["sport"="swimming"](${bb});`,
    subtypes.includes('downhill') && `node["leisure"="ski_resort"](${bb});\n    way["piste:type"="downhill"](${bb});\n    relation["route"="ski"]["piste:type"="downhill"](${bb});`,
    subtypes.includes('nordic')   && `relation["route"="ski"]["piste:type"="nordic"](${bb});\n    way["piste:type"="nordic"](${bb});`,
  ].filter(Boolean).join('\n    ');
  if (!lines) return [];
  const q = `[out:json][timeout:30][maxsize:16777216];(\n    ${lines}\n  );out center tags 120;`;
  const data = await overpass(q);
  const seen = new Set();
  return data.elements.map(el => {
    const tags = el.tags || {};
    const c = el.center || {lat: el.lat, lon: el.lon};
    if (!c?.lat || !tags.name || seen.has(tags.name)) return null;
    seen.add(tags.name);
    let type = 'nature', label = 'Nature Area', icon = '🌿', wtType = null;
    if      (tags.route === 'hiking')                              { type='hiking';   label='Hiking Trail';    icon='🥾'; wtType='hiking'; }
    else if (tags.route === 'running')                             { type='hiking';   label='Running Route';   icon='🏃'; }
    else if (tags.route === 'bicycle')                             { type='cycling';  label='Cycling Route';   icon='🚴'; wtType='cycling'; }
    else if (tags.route === 'mtb')                                 { type='cycling';  label='MTB Route';       icon='🚵'; wtType='mtb'; }
    else if (tags.leisure === 'swimming_area' || tags.sport === 'swimming') { type='swimming'; label='Swimming Spot';    icon='🏊'; }
    else if (tags.leisure === 'swimming_pool')                     { type='swimming'; label='Swimming Pool';   icon='🏊'; }
    else if (tags.natural === 'water' && tags.sport === 'swimming'){ type='swimming'; label='Open Water';      icon='🌊'; }
    else if (tags.leisure === 'ski_resort')                        { type='skiing';   label='Ski Resort';      icon='⛷️'; }
    else if (tags['piste:type'] === 'downhill' || (tags.route === 'ski' && tags['piste:type'] === 'downhill')) { type='skiing'; label='Downhill Ski';  icon='⛷️'; }
    else if (tags['piste:type'] === 'nordic'   || (tags.route === 'ski' && tags['piste:type'] === 'nordic'))   { type='skiing'; label='Nordic Skiing'; icon='🎿'; }
    else if (tags.boundary === 'national_park')                    { type='nature';   label='National Park';   icon='🌲'; }
    else if (tags.leisure === 'nature_reserve')                    { type='nature';   label='Nature Reserve';  icon='🌿'; }
    return {
      id: el.id, name: tags.name,
      sub: tags.network || tags.operator || tags.ref || null,
      trailDist: tags.distance || tags['route:km'] || null,
      isLoop: tags.roundtrip === 'yes',
      type, label, icon, lat: c.lat, lon: c.lon,
      source: wtType ? 'wt' : 'osm', wtType
    };
  }).filter(Boolean);
}

async function downloadGPX(idx) {
  const t = currentTrails[idx];
  if (t.source === 'custom') {
    return downloadCustomGPX(t.dbId, t.name);
  } else if (t.source === 'wt') {
    const blob = await wtCall('gpx', t.wtType, {id: t.id});
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: t.name.replace(/[^a-z0-9]/gi, '_') + '.gpx'
    });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } else {
    const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="TrailbyRail" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata><name>${t.name}</name></metadata>
  <wpt lat="${t.lat}" lon="${t.lon}"><name>${t.name}</name></wpt>
</gpx>`;
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([gpx], {type:'application/gpx+xml'})),
      download: t.name.replace(/[^a-z0-9]/gi, '_') + '.gpx'
    });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
}

document.getElementById('searchForm').addEventListener('submit', async e => {
  e.preventDefault();

  const location = document.getElementById('location').value.trim();
  const activity = document.getElementById('activity').value;
  const walkToStop = parseInt(document.getElementById('walkToStop').value);
  const walkFromStop = parseInt(document.getElementById('walkFromStop').value);
  const ptModes = getChecked('ptMode');
  const trailSubtypes = getChecked('trailType');
  if (!ptModes.length) { alert('Select at least one transport mode.'); return; }
  if (!trailSubtypes.length) { alert('Select at least one trail type.'); return; }
  const btn = document.getElementById('findBtn');
  const resultsDiv = document.getElementById('results');

  btn.disabled = true;

  // ── Resolve search centre ──────────────────────────────────────────────────
  let searchLat, searchLon;
  if (searchMode === 'destination') {
    const destValue = destInput.value.trim();
    if (!destValue) { btn.disabled = false; alert('Enter a destination to search.'); return; }
    if (selectedDestCoords) {
      destLat = selectedDestCoords.lat; destLon = selectedDestCoords.lon;
    } else {
      const dc = await geocode(destValue).catch(() => null);
      if (!dc) { btn.disabled = false; resultsDiv.innerHTML = `<div class="error">⚠️ Destination not found.</div>`; return; }
      destLat = dc.lat; destLon = dc.lon;
    }
    searchLat = destLat; searchLon = destLon;
    // Also resolve home if provided (used for journey planning links)
    if (location && !homeLat) {
      const hc = await geocode(location).catch(() => null);
      if (hc) { homeLat = hc.lat; homeLon = hc.lon; }
    }
  } else {
    const coords = await geocode(location);
    homeLat = coords.lat; homeLon = coords.lon;
    searchLat = homeLat; searchLon = homeLon;
  }

  const destLabel = searchMode === 'destination' ? destInput.value.trim() : '';

  resultsDiv.innerHTML = `<div class="loading">
    <div class="loading-spinner">🔄</div>
    <div class="loading-msg">${searchMode === 'destination' ? `Finding trails near <strong>${destLabel}</strong>…` : 'Finding trails reachable by public transport…'}</div>
    <div class="loading-sub">${searchMode === 'destination' ? `Trails within ${fmt(walkFromStop)} of a PT stop · get there by train` : `Stops within ${fmt(walkToStop)} of home · trails within ${fmt(walkFromStop)} of a stop`}</div>
  </div>`;

  try {
    const combinedRadius = searchMode === 'destination' ? walkFromStop : walkToStop + walkFromStop;
    const stopRadius = searchMode === 'destination' ? walkFromStop : walkToStop;
    const [stops, osmTrails, odaTrails, customTrails] = await Promise.all([
      fetchStops(searchLat, searchLon, stopRadius, ptModes),
      fetchTrails(searchLat, searchLon, combinedRadius, trailSubtypes),
      fetchOutdooractive(searchLat, searchLon, combinedRadius, trailSubtypes),
      fetchCustomRoutes(searchLat, searchLon, combinedRadius),
    ]);

    const osmNames = new Set(osmTrails.map(t => t.name.toLowerCase()));
    const trails = [
      ...customTrails,  // custom routes always shown first
      ...osmTrails,
      ...odaTrails.filter(t => !osmNames.has(t.name.toLowerCase())),
    ];

    const results = trails.map(trail => {
      const connecting = stops
        .map(s => ({...s, distToTrail: dist(trail.lat, trail.lon, s.lat, s.lon)}))
        .filter(s => s.distToTrail <= walkFromStop)
        .sort((a, b) => a.distToTrail - b.distToTrail)
        .slice(0, 4);
      return {...trail, stops: connecting};
    }).filter(t => t.stops.length > 0)
      .sort((a, b) => a.stops[0].distToTrail - b.stops[0].distToTrail);

    currentTrails = results;
    btn.disabled = false;

    if (!results.length) {
      resultsDiv.innerHTML = `<div class="no-results">
        <div class="no-results-icon">🏞️</div>
        <h3>No results found</h3>
        <p>No trails with a nearby PT stop were found. Try increasing the "walk from stop to trail" distance, or search a different area.</p>
      </div>`;
      return;
    }

    resultsDiv.innerHTML = `
      <div class="results-meta">
        <span class="results-count">${results.length} trail${results.length !== 1 ? 's' : ''} found</span>
        <span class="results-hint">${searchMode === 'destination' ? `📍 ${destLabel} · ≤${fmt(walkFromStop)} stop to trail` : `≤${fmt(walkToStop)} to stop · ≤${fmt(walkFromStop)} stop to trail`}</span>
        <div style="display:flex;gap:.45rem;flex-wrap:wrap">
          <button class="meta-btn" onclick="downloadAllGPX()">📦 Download all GPX</button>
          <button class="meta-btn" id="shareListBtn" onclick="shareList()">🔗 Share list</button>
        </div>
      </div>
      <div class="filter-bar" id="filterBar">
        <label>Min km <input type="number" id="filterMinKm" min="0" step="0.5" placeholder="0" oninput="applyFilters()"></label>
        <label>Max km <input type="number" id="filterMaxKm" min="0" step="0.5" placeholder="∞" oninput="applyFilters()"></label>
        <label><input type="checkbox" id="filterHideCompleted" onchange="applyFilters()"> Hide completed</label>
      </div>
      <div class="results-grid" id="resultsGrid">
        ${results.map((t, i) => renderCard(t, i)).join('')}
      </div>`;
    results.forEach((t, i) => fetchWeatherForCard(i, t.lat, t.lon));

  } catch(err) {
    btn.disabled = false;
    const is504 = err.message.includes('504') || err.message.includes('502');
    resultsDiv.innerHTML = is504
      ? `<div class="no-results">
          <div class="no-results-icon">⏱️</div>
          <h3>Search timed out</h3>
          <p>The map database is busy or the search area is too large.<br>
             Try <strong>reducing the radius</strong>, selecting fewer trail types, or search again in a moment.</p>
          <button class="btn-find" style="margin-top:1rem;padding:.75rem 2rem" onclick="document.getElementById('findBtn').click()">🔄 Try again</button>
        </div>`
      : `<div class="error">⚠️ ${err.message}</div>`;
  }
});

function seasonalChip(type) {
  const m = new Date().getMonth(); // 0=Jan
  const chips = {
    hiking:   m >= 2  && m <= 4  ? '🌸 Spring'
            : m >= 5  && m <= 7  ? '☀️ Summer'
            : m >= 8  && m <= 10 ? '🍂 Autumn'
            : '❄️ Winter',
    cycling:  (m >= 10 || m <= 1) ? '🧤 Dress warm' : '✅ Good conditions',
    swimming: (m >= 5  && m <= 7) ? '🏊 In season'  : '❄️ Off season',
    skiing:   (m >= 11 || m <= 1) ? '⛷️ In season'  : '🌱 Off season',
  };
  const text = chips[type] || chips.hiking;
  return `<span class="season-chip">${text}</span>`;
}

// ── Loop generation ───────────────────────────────────────────────────────────
const loopResults = {};

async function shareTrail(idx) {
  const t = currentTrails[idx];
  const best = t.stops[0];
  const mapsUrl = `https://www.google.com/maps?q=${t.lat},${t.lon}`;
  const dist = t.trailDist ? ` · ${t.trailDist}km` : '';
  const stopLine = best ? `\nNearest stop: ${best.icon} ${best.name} (${fmt(best.distToTrail)} away)` : '';
  const text = `${t.icon} ${t.name}${dist}\n${t.label}${stopLine}\n${mapsUrl}`;
  const btn = document.getElementById(`shareBtn-${idx}`);

  if (navigator.share) {
    try {
      await navigator.share({ title: t.name, text, url: mapsUrl });
    } catch {}
    return;
  }

  // Fallback: copy to clipboard
  try {
    await navigator.clipboard.writeText(text);
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  } catch {
    prompt('Copy this trail info:', text);
  }
}

function toggleLoopPanel(idx) {
  const panel = document.getElementById(`loop-${idx}`);
  panel.classList.toggle('open');
}

function updateLoopSlider(idx) {
  const val = parseInt(document.getElementById(`loopDist-${idx}`).value);
  document.getElementById(`loopDistVal-${idx}`).textContent = fmt(val);
}

async function doGenerateLoop(idx) {
  const trail   = currentTrails[idx];
  const stop    = trail.stops[0];
  const distM   = parseInt(document.getElementById(`loopDist-${idx}`).value);
  const resultEl = document.getElementById(`loopResult-${idx}`);
  const vehicle = trail.type === 'hiking' ? 'foot' : trail.wtType === 'mtb' ? 'mtb' : 'bike';
  resultEl.innerHTML = '<span style="color:var(--moss);font-size:.88rem">🔄 Generating…</span>';

  try {
    const r = await fetch('/api/graphhopper', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({lat: stop.lat, lon: stop.lon, distance: distM, vehicle})
    });
    let d;
    try { d = await r.json(); } catch { throw new Error(`Server error ${r.status}`); }
    if (!r.ok || d.message || d.error) throw new Error(d?.message || d?.error || `Error ${r.status}`);
    const path = d.paths?.[0];
    if (!path) throw new Error('No route returned');
    loopResults[idx] = path.points.coordinates;
    const km = (path.distance / 1000).toFixed(1);
    resultEl.innerHTML = `
      <span style="color:var(--forest-dark);font-size:.88rem">✅ <strong>${km}km</strong> loop generated</span>
      <button class="act-btn" style="margin-left:.5rem" onclick="downloadLoopGPX(${idx},'${km}km loop from ${stop.name.replace(/'/g,"\\'")}')">📥 GPX</button>`;
  } catch(e) {
    resultEl.innerHTML = `<div class="error" style="font-size:.82rem">⚠️ ${e.message}</div>`;
  }
}

function downloadLoopGPX(idx, name) {
  const coords = loopResults[idx];
  if (!coords) return;
  const trkpts = coords.map(([lo, la]) => `    <trkpt lat="${la}" lon="${lo}"></trkpt>`).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="TrailbyRail" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata><name>${name}</name></metadata>
  <trk><name>${name}</name><trkseg>\n${trkpts}\n  </trkseg></trk>
</gpx>`;
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([gpx], {type:'application/gpx+xml'})),
    download: name.replace(/[^a-z0-9]/gi, '_') + '.gpx'
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ── Custom routes ─────────────────────────────────────────────────────────────
async function fetchCustomRoutes(lat, lon, radiusM) {
  try {
    const r = await fetch('/api/custom-routes', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'list', lat, lon, radius_m: radiusM})
    });
    const rows = await r.json();
    return (Array.isArray(rows) ? rows : []).map(row => ({
      id: `custom_${row.id}`, dbId: row.id,
      name: row.name, sub: 'My Route',
      trailDist: row.dist_km ? String(row.dist_km) : null,
      isLoop: false, difficulty: null, elevGain: null,
      type: row.activity_type === 'cycling' || row.activity_type === 'mtb' ? 'cycling' : 'hiking',
      label: row.activity_type === 'mtb' ? 'MTB Route' : row.activity_type === 'cycling' ? 'Cycling Route' : 'Hiking Trail',
      icon: row.activity_type === 'mtb' ? '🚵' : row.activity_type === 'cycling' ? '🚴' : '🥾',
      lat: row.lat, lon: row.lon,
      source: 'custom', wtType: null, oda_url: null
    }));
  } catch { return []; }
}

async function loadMyRoutes() {
  const listEl = document.getElementById('myRoutesList');
  try {
    const r = await fetch('/api/custom-routes', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'list'})
    });
    const rows = await r.json();
    if (!rows.length) {
      listEl.innerHTML = '<p style="color:var(--moss);font-size:.9rem">No custom routes yet. Upload a GPX to include your own routes in search results.</p>';
      return;
    }
    listEl.innerHTML = rows.map(row => `
      <div class="route-item">
        <div class="route-item-info">
          <div class="route-item-name">${row.name}</div>
          <div class="route-item-meta">${row.activity_type}${row.dist_km ? ' · ' + row.dist_km + 'km' : ''} · ${row.created_at.split(' ')[0]}</div>
        </div>
        <button class="act-btn" style="padding:.4rem .7rem" onclick="downloadCustomGPX(${row.id},'${row.name.replace(/'/g,"\\'")}')">📥</button>
        <button class="btn-delete" onclick="deleteCustomRoute(${row.id})" title="Delete">🗑️</button>
      </div>`).join('');
  } catch(e) {
    listEl.innerHTML = '<p style="color:#c33;font-size:.85rem">Could not load routes.</p>';
  }
}

async function doUploadGPX() {
  const file   = document.getElementById('gpxFile').files[0];
  const status = document.getElementById('uploadStatus');
  if (!file) { status.innerHTML = '<span style="color:#c33">Please select a .gpx file</span>'; return; }
  status.innerHTML = 'Uploading…';
  try {
    const gpxText = await file.text();
    const name    = document.getElementById('uploadName').value.trim() || file.name.replace(/\.gpx$/i,'');
    const r = await fetch('/api/upload-gpx', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({gpx: gpxText, name, activity_type: document.getElementById('uploadType').value})
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    status.innerHTML = `<span style="color:var(--moss)">✅ "${d.name}" uploaded (${d.dist_km ? d.dist_km+'km' : 'distance unknown'})</span>`;
    document.getElementById('uploadName').value = '';
    document.getElementById('gpxFile').value = '';
    loadMyRoutes();
  } catch(e) {
    status.innerHTML = `<span style="color:#c33">⚠️ ${e.message}</span>`;
  }
}

async function downloadCustomGPX(id, name) {
  const r = await fetch('/api/custom-routes', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({action:'get-gpx', id})
  });
  const blob = await r.blob();
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: name.replace(/[^a-z0-9]/gi,'_') + '.gpx'
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

async function deleteCustomRoute(id) {
  if (!confirm('Delete this route?')) return;
  await fetch('/api/custom-routes', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({action:'delete', id})
  });
  loadMyRoutes();
}

function toggleUploadForm() {
  const f = document.getElementById('uploadForm');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
  document.getElementById('uploadStatus').innerHTML = '';
}

async function getLocation() {
  const input = document.getElementById('location');
  const btn = document.getElementById('locationBtn');
  if (!navigator.geolocation) { input.placeholder = 'Enter your address'; return; }
  input.placeholder = 'Detecting location…';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    async pos => {
      homeLat = pos.coords.latitude; homeLon = pos.coords.longitude;
      input.value = await reverseGeocode(homeLat, homeLon);
      btn.disabled = false;
    },
    () => { input.placeholder = 'e.g. Amsterdam, Breda, Utrecht…'; btn.disabled = false; },
    {enableHighAccuracy: false, timeout: 10000, maximumAge: 300000}
  );
}

document.getElementById('locationBtn').addEventListener('click', getLocation);
window.addEventListener('load', async () => {
  getLocation();
  loadMyRoutes();
  await restoreAuthSession();
  renderSavedSearchChips();
  checkHashAndAutoSearch();
});

// ── Weather ───────────────────────────────────────────────────────────────────
const WMO_EMOJI = {
  0:'☀️', 1:'⛅', 2:'⛅', 3:'⛅',
  45:'🌫️', 48:'🌫️',
  51:'🌧️', 53:'🌧️', 55:'🌧️', 56:'🌧️', 57:'🌧️', 61:'🌧️', 63:'🌧️', 65:'🌧️', 66:'🌧️', 67:'🌧️',
  71:'❄️', 73:'❄️', 75:'❄️', 77:'❄️',
  80:'🌦️', 81:'🌦️', 82:'🌦️',
  95:'⛈️', 96:'⛈️', 99:'⛈️'
};
function wmoEmoji(code) {
  return WMO_EMOJI[code] || '🌡️';
}

async function fetchWeatherForCard(idx, lat, lon) {
  const el = document.getElementById(`weather-${idx}`);
  if (!el) return;
  try {
    const r = await fetch('/api/weather', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({lat, lon})
    });
    const d = await r.json();
    const daily = d.daily;
    if (!daily) return;
    const days = [0,1,2].map(i => {
      const date = new Date(daily.time[i]);
      const dayName = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : date.toLocaleDateString('en', {weekday:'short'});
      const emoji = wmoEmoji(daily.weathercode[i]);
      const maxT = Math.round(daily.temperature_2m_max[i]);
      const minT = Math.round(daily.temperature_2m_min[i]);
      const precip = daily.precipitation_sum[i];
      return `<div class="weather-day">
        <span class="weather-emoji">${emoji}</span>
        <div style="font-size:.72rem;color:var(--moss);margin-bottom:.1rem">${dayName}</div>
        <div class="weather-temp">${maxT}°/${minT}°</div>
        ${precip > 0 ? `<div class="weather-precip">💧${precip}mm</div>` : ''}
      </div>`;
    });
    el.innerHTML = `<div class="weather-row">${days.join('')}</div>`;
  } catch { /* silently skip */ }
}

// ── Filters ───────────────────────────────────────────────────────────────────
function applyFilters() {
  const minKm = parseFloat(document.getElementById('filterMinKm')?.value) || 0;
  const maxKm = parseFloat(document.getElementById('filterMaxKm')?.value) || Infinity;
  const hideCompleted = document.getElementById('filterHideCompleted')?.checked || false;
  const grid = document.getElementById('resultsGrid');
  if (!grid) return;
  let visible = 0;
  currentTrails.forEach((t, i) => {
    const card = document.getElementById(`card-${i}`);
    if (!card) return;
    const km = parseFloat(t.trailDist) || 0;
    const done = doneTrails.has(t.name);
    const show = (!minKm || km >= minKm) && (!isFinite(maxKm) || km <= maxKm) && !(hideCompleted && done);
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  const countEl = document.querySelector('.results-count');
  if (countEl) countEl.textContent = `${visible} trail${visible !== 1 ? 's' : ''} found`;
}

// ── Done button ───────────────────────────────────────────────────────────────
function saveDoneTrails() {
  localStorage.setItem('doneTrails', JSON.stringify([...doneTrails]));
}

function toggleDone(idx) {
  const t = currentTrails[idx];
  const btn = document.getElementById(`doneBtn-${idx}`);
  const card = document.getElementById(`card-${idx}`);
  const removing = doneTrails.has(t.name);
  if (removing) {
    doneTrails.delete(t.name);
    btn.textContent = '🏅 Done';
    btn.classList.remove('done-active');
    if (card) { card.classList.remove('done-trail'); card.style.borderLeftColor = ''; }
  } else {
    doneTrails.add(t.name);
    btn.textContent = '✅ Done';
    btn.classList.add('done-active');
    if (card) { card.classList.add('done-trail'); card.style.borderLeftColor = 'var(--moss)'; }
  }
  saveDoneTrails();
  applyFilters();
  if (currentUser) {
    fetch('/api/done-trails', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({trail_name: t.name, trail_lat: t.lat, trail_lon: t.lon, action: removing ? 'remove' : 'add'})
    }).catch(() => {});
  } else {
    showSyncHint();
  }
}
