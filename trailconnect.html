function setStarRating(idx, n) {
  reviewRatings[idx] = n;
  const stars = document.querySelectorAll(`#stars-${idx} span`);
  stars.forEach((s, i) => s.classList.toggle('active', i < n));
}

async function loadReviews(idx) {
  const t = currentTrails[idx];
  const listEl = document.getElementById(`review-list-${idx}`);
  try {
    const r = await fetch('/api/reviews', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({trail_id: String(t.id)})
    });
    const d = await r.json();
    // Update avg badge on card
    const avgEl = document.getElementById(`avg-${idx}`);
    if (avgEl && d.avg) avgEl.textContent = `⭐ ${d.avg} (${d.count})`;
    if (!d.reviews.length) {
      listEl.innerHTML = '<p style="font-size:.85rem;color:var(--moss)">No reviews yet. Be the first!</p>';
      return;
    }
    listEl.innerHTML = d.reviews.map(rv => `
      <div class="review-item">
        <div class="review-stars">${'★'.repeat(rv.rating)}${'☆'.repeat(5 - rv.rating)}</div>
        ${rv.comment ? `<div class="review-comment">${rv.comment.replace(/</g,'&lt;')}</div>` : ''}
        <div class="review-date">${rv.created_at ? rv.created_at.split(' ')[0] : ''}</div>
      </div>`).join('');
  } catch {
    listEl.innerHTML = '<p style="font-size:.82rem;color:#c33">Could not load reviews.</p>';
  }
}

async function toggleReviews(idx) {
  const panel = document.getElementById(`review-${idx}`);
  panel.classList.toggle('open');
  if (panel.classList.contains('open') && !reviewsLoaded[idx]) {
    reviewsLoaded[idx] = true;
    await loadReviews(idx);
  }
}

async function submitReview(idx) {
  const t = currentTrails[idx];
  const rating = reviewRatings[idx] || 0;
  const comment = document.getElementById(`reviewComment-${idx}`).value.trim();
  const statusEl = document.getElementById(`reviewStatus-${idx}`);
  if (!rating) { statusEl.textContent = 'Please select a star rating.'; statusEl.style.color = '#c33'; return; }
  statusEl.textContent = 'Submitting…'; statusEl.style.color = 'var(--moss)';
  try {
    const r = await fetch('/api/review-add', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({trail_id: String(t.id), trail_name: t.name, rating, comment})
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    statusEl.textContent = '✅ Thanks!';
    document.getElementById(`reviewComment-${idx}`).value = '';
    reviewRatings[idx] = 0;
    document.querySelectorAll(`#stars-${idx} span`).forEach(s => s.classList.remove('active'));
    reviewsLoaded[idx] = false;
    await loadReviews(idx);
  } catch(e) {
    statusEl.textContent = '⚠️ ' + e.message; statusEl.style.color = '#c33';
  }
}

// ── Saved searches ────────────────────────────────────────────────────────────
function getSavedSearches() {
  return JSON.parse(localStorage.getItem('savedSearches') || '[]');
}

function saveCurrentSearch() {
  const location = document.getElementById('location').value.trim();
  if (!location) { alert('Enter a location first.'); return; }
  const activity = document.getElementById('activity').value;
  const walkToStop = parseInt(document.getElementById('walkToStop').value);
  const walkFromStop = parseInt(document.getElementById('walkFromStop').value);
  const ptModes = getChecked('ptMode');
  const trailSubtypes = getChecked('trailType');
  const entry = {location, activity, walkToStop, walkFromStop, ptModes, trailSubtypes, coords: selectedCoords || null};
  const searches = getSavedSearches().filter(s => s.location !== location);
  searches.unshift(entry);
  localStorage.setItem('savedSearches', JSON.stringify(searches.slice(0, 5)));
  renderSavedSearchChips();
  if (currentUser) {
    fetch('/api/saved-searches', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'save', label: `${location} · ${activity}`, data: JSON.stringify(entry)})
    }).catch(() => {});
  } else {
    showSyncHint();
  }
}

function renderSavedSearchChips() {
  const row = document.getElementById('savedSearchesRow');
  if (!row) return;
  const searches = getSavedSearches();
  if (!searches.length) { row.innerHTML = ''; return; }
  row.innerHTML = searches.map((s, i) =>
    `<div class="saved-chip" onclick="restoreSearch(${i})">
      <span style="overflow:hidden;text-overflow:ellipsis">${s.location} · ${s.activity}</span>
      <span class="del-saved" onclick="event.stopPropagation();deleteSavedSearch(${i})">✕</span>
    </div>`
  ).join('');
}

function restoreSearch(i) {
  const s = getSavedSearches()[i];
  if (!s) return;
  document.getElementById('location').value = s.location;
  document.getElementById('activity').value = s.activity;
  if (s.coords) selectedCoords = s.coords;
  setSliders(s.activity);
  updateTrailTypeChips(s.activity);
  document.getElementById('walkToStop').value = s.walkToStop;
  document.getElementById('walkFromStop').value = s.walkFromStop;
  updateSlider('walkToStop', 'walkToStopVal');
  updateSlider('walkFromStop', 'walkFromStopVal');
  // restore pt modes
  document.querySelectorAll('input[name="ptMode"]').forEach(el => {
    el.checked = s.ptModes.includes(el.value);
  });
  // restore trail subtypes
  document.querySelectorAll('input[name="trailType"]').forEach(el => {
    el.checked = s.trailSubtypes.includes(el.value);
  });
  // auto-submit
  document.getElementById('searchForm').dispatchEvent(new Event('submit'));
}

function deleteSavedSearch(i) {
  const searches = getSavedSearches();
  searches.splice(i, 1);
  localStorage.setItem('savedSearches', JSON.stringify(searches));
  renderSavedSearchChips();
}

// ── GPX pack download ─────────────────────────────────────────────────────────
async function downloadAllGPX() {
  if (typeof JSZip === 'undefined') { alert('JSZip not loaded.'); return; }
  const zip = new JSZip();
  const visible = currentTrails.filter((t, i) => {
    const card = document.getElementById(`card-${i}`);
    return !card || card.style.display !== 'none';
  });
  if (!visible.length) { alert('No visible trails to download.'); return; }
  visible.forEach(t => {
    const safeName = t.name.replace(/[^a-z0-9]/gi, '_');
    const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="TrailbyRail" xmlns="http://www.topografix.com/GPX/1/1">\n  <metadata><name>${t.name}</name></metadata>\n  <wpt lat="${t.lat}" lon="${t.lon}"><name>${t.name}</name></wpt>\n</gpx>`;
    zip.file(`${safeName}.gpx`, gpx);
  });
  const blob = await zip.generateAsync({type: 'blob'});
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: 'trailbyrail-pack.zip'
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ── Share curated list ────────────────────────────────────────────────────────
function buildShareHash() {
  const params = {
    location: document.getElementById('location').value.trim(),
    activity: document.getElementById('activity').value,
    walkToStop: document.getElementById('walkToStop').value,
    walkFromStop: document.getElementById('walkFromStop').value,
    ptModes: getChecked('ptMode').join(','),
    trailSubtypes: getChecked('trailType').join(','),
  };
  return '#share=' + encodeURIComponent(JSON.stringify(params));
}

async function shareList() {
  const hash = buildShareHash();
  const url = location.origin + location.pathname + hash;
  const btn = document.getElementById('shareListBtn');
  try {
    await navigator.clipboard.writeText(url);
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  } catch {
    prompt('Copy this URL to share your trail list:', url);
  }
  history.replaceState(null, '', hash);
}

function checkHashAndAutoSearch() {
  const hash = location.hash;
  if (!hash.startsWith('#share=')) return;
  try {
    const params = JSON.parse(decodeURIComponent(hash.slice(7)));
    if (!params.location) return;
    document.getElementById('location').value = params.location;
    document.getElementById('activity').value = params.activity || 'hiking';
    setSliders(params.activity || 'hiking');
    updateTrailTypeChips(params.activity || 'hiking');
    if (params.walkToStop) { document.getElementById('walkToStop').value = params.walkToStop; updateSlider('walkToStop', 'walkToStopVal'); }
    if (params.walkFromStop) { document.getElementById('walkFromStop').value = params.walkFromStop; updateSlider('walkFromStop', 'walkFromStopVal'); }
    if (params.ptModes) {
      const modes = params.ptModes.split(',');
      document.querySelectorAll('input[name="ptMode"]').forEach(el => { el.checked = modes.includes(el.value); });
    }
    if (params.trailSubtypes) {
      const subs = params.trailSubtypes.split(',');
      document.querySelectorAll('input[name="trailType"]').forEach(el => { el.checked = subs.includes(el.value); });
    }
    document.getElementById('searchForm').dispatchEvent(new Event('submit'));
  } catch { /* ignore malformed hash */ }
}

// ── Auth UI ───────────────────────────────────────────────────────────────────

let authMode = 'login'; // 'login' | 'register'

function showAuthModal(mode) {
  authMode = mode || 'login';
  updateAuthModalView();
  document.getElementById('authModal').style.display = 'flex';
  document.getElementById('authEmail').focus();
  document.getElementById('authError').textContent = '';
}

function closeAuthModal() {
  document.getElementById('authModal').style.display = 'none';
}

function toggleAuthView() {
  authMode = authMode === 'login' ? 'register' : 'login';
  updateAuthModalView();
  document.getElementById('authError').textContent = '';
}

function updateAuthModalView() {
  const isLogin = authMode === 'login';
  document.getElementById('authModalTitle').textContent = isLogin ? 'Log in' : 'Create account';
  document.getElementById('authModalSub').textContent = isLogin
    ? 'Sync done trails & saved searches across devices'
    : 'Free account — sync your progress across devices';
  document.getElementById('authSubmitBtn').textContent = isLogin ? 'Log in' : 'Create account';
  document.getElementById('authToggleBtn').textContent = isLogin
    ? 'No account yet? Register'
    : 'Already have an account? Log in';
  document.getElementById('authPassword').autocomplete = isLogin ? 'current-password' : 'new-password';
}

async function submitAuth() {
  const email    = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errorEl  = document.getElementById('authError');
  const btn      = document.getElementById('authSubmitBtn');
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
    const r = await fetch(endpoint, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Something went wrong');
    currentUser = {id: d.id, email: d.email, is_pro: d.is_pro || 0};
    updateAuthBar();
    closeAuthModal();
    await syncLocalDataToServer();
    await loadServerDoneTrails();
  } catch(e) {
    errorEl.textContent = e.message;
  } finally {
    btn.disabled = false;
    updateAuthModalView();
  }
}

async function doLogout() {
  await fetch('/api/auth/logout', {method:'POST'}).catch(() => {});
  currentUser = null;
  updateAuthBar();
}

function updateAuthBar() {
  const bar = document.getElementById('authBar');
  if (!bar) return;
  if (currentUser) {
    bar.innerHTML = `
      <span class="auth-bar-user">👤 ${currentUser.email}</span>
      <button class="auth-bar-btn" onclick="doLogout()">Logout</button>`;
  } else {
    bar.innerHTML = `
      <button class="auth-bar-btn" onclick="showAuthModal('login')">Login</button>
      <button class="auth-bar-btn" onclick="showAuthModal('register')">Register</button>`;
  }
}

async function restoreAuthSession() {
  try {
    const r = await fetch('/api/auth/me');
    if (!r.ok) return;
    const d = await r.json();
    currentUser = {id: d.id, email: d.email, is_pro: d.is_pro};
    updateAuthBar();
    await loadServerDoneTrails();
  } catch { /* not logged in */ }
}

async function loadServerDoneTrails() {
  if (!currentUser) return;
  try {
    const r = await fetch('/api/done-trails');
    if (!r.ok) return;
    const rows = await r.json();
    rows.forEach(row => doneTrails.add(row.trail_name));
    saveDoneTrails();
  } catch { /* ignore */ }
}

async function syncLocalDataToServer() {
  if (!currentUser) return;
  // Sync done trails
  const localDone = [...doneTrails];
  for (const name of localDone) {
    fetch('/api/done-trails', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({trail_name: name, action: 'add'})
    }).catch(() => {});
  }
  // Sync saved searches
  const searches = getSavedSearches();
  for (const s of searches) {
    fetch('/api/saved-searches', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'save', label: `${s.location} · ${s.activity}`, data: JSON.stringify(s)})
    }).catch(() => {});
  }
}

// ── Sync hint ─────────────────────────────────────────────────────────────────
let syncHintShown = false;
function showSyncHint() {
  if (syncHintShown) return;
  syncHintShown = true;
  const row = document.getElementById('savedSearchesRow');
  if (!row) return;
  const hint = document.createElement('div');
  hint.className = 'sync-hint';
  hint.id = 'syncHint';
  hint.innerHTML = `💡 Log in to sync across devices
    <button onclick="document.getElementById('syncHint').remove();syncHintShown=false" title="Dismiss">✕</button>`;
  row.parentNode.insertBefore(hint, row.nextSibling);
}
